name: Watch Relaam listings

on:
  schedule:
    - cron: "17 * * * *"   # every hour (minute 17 avoids the busy top of the hour)
  workflow_dispatch:        # "Run workflow" button for manual checks

permissions:
  contents: write

concurrency:
  group: relaam-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Save debug snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-snapshot
          path: debug/
          retention-days: 3

      - name: Commit seen listings
        run: |
          git config user.name "relaam-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git push
